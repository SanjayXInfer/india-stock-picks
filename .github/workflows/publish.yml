# Scrape on a schedule and publish the static dashboard to GitHub Pages.
#
# What gets published: ONLY the ./site folder (index.html, app.js, styles.css, data.json).
# What never gets published: the API key (a repository secret), the SQLite DB and HTTP cache (kept in the
# private Actions cache between runs), logs, .env, and the repo's git history (Pages serves the artifact,
# not the repository). scripts/check_public.py blocks the deploy if anything sensitive slips into ./site.
#
# Times are UTC (IST = UTC+5:30). GitHub may start scheduled runs a few minutes late.
name: Scrape and publish

on:
  # Schedule disabled: several sources (Financial Express, Trendlyne, parts of CNBC-TV18) block GitHub's
  # datacenter IPs, so the recommended setup scrapes on your own PC and runs `python dev.py publish`
  # (see README). This manual trigger is kept only as a fallback; it deploys via the Pages "GitHub
  # Actions" source, which conflicts with the gh-pages branch setup, so use one or the other.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database between runs (private to this repo's workflows)
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; heuristic extractor if unset
          CONTACT_URL: ${{ vars.CONTACT_URL }}                  # optional repo variable, e.g. the repo URL
        run: python scripts/seed.py

      - name: Build static site
        run: python scripts/export_static.py

      - name: Public safety check (fails the deploy if a secret or unexpected file is present)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # lets the checker verify its value is absent
        run: python scripts/check_public.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
